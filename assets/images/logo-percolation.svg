<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" aria-label="Dr. Soly Mathew Hexagonal Percolation Logo">
  <defs>
    <linearGradient id="hexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tealLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="hexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#hexBg)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>

  <!-- Molecular Hexagonal Lattice -->
  <polygon points="60,20 92,38 92,76 60,96 28,76 28,38" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <polygon points="60,26 86,41 86,73 60,88 34,73 34,41" fill="none" stroke="url(#cyanLine)" stroke-width="2.5" opacity="0.6"/>

  <!-- Stylized Geometric S and M Nodes -->
  <path d="M 40 44 L 60 32 L 80 44 L 80 60 L 60 72 L 40 60 L 40 76 L 60 88 L 80 76" 
        fill="none" 
        stroke="url(#cyanLine)" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#hexGlow)"/>

  <!-- Central Dielectric Energy Core -->
  <circle cx="60" cy="52" r="6" fill="#38bdf8" filter="url(#hexGlow)"/>
  <circle cx="60" cy="52" r="2.5" fill="#ffffff"/>

  <!-- Satellite Nanoparticle Vertices -->
  <circle cx="40" cy="44" r="3" fill="#2dd4bf"/>
  <circle cx="80" cy="44" r="3" fill="#38bdf8"/>
  <circle cx="40" cy="76" r="3" fill="#38bdf8"/>
  <circle cx="80" cy="76" r="3" fill="#2dd4bf"/>
</svg>
