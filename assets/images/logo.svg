<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" aria-label="Dr. Soly Mathew Creative Logo">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1a2f"/>
      <stop offset="50%" stop-color="#091322"/>
      <stop offset="100%" stop-color="#040913"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Upper Flexible Plate Gradient -->
    <linearGradient id="topPlateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Lower Flexible Plate Gradient -->
    <linearGradient id="bottomPlateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Central S-M Polymer Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Luminous Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Rounded Squircle -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle Microfabrication Coordinate Grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="28" y1="16" x2="28" y2="104"/>
    <line x1="60" y1="16" x2="60" y2="104"/>
    <line x1="92" y1="16" x2="92" y2="104"/>
    <line x1="16" y1="28" x2="104" y2="28"/>
    <line x1="16" y1="60" x2="104" y2="60"/>
    <line x1="16" y1="92" x2="104" y2="92"/>
  </g>

  <!-- Central Radial Ambience -->
  <circle cx="60" cy="60" r="34" fill="#0284c7" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Top Flexible Electrode (Curved under compressive tactile pressure) -->
  <path d="M 26 32 C 44 42, 76 42, 94 32" fill="none" stroke="url(#topPlateGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="26" cy="32" r="2.5" fill="#38bdf8"/>
  <circle cx="94" cy="32" r="2.5" fill="#0284c7"/>

  <!-- Central Dynamic "S-M" Tactile Polymer Ribbon -->
  <!-- Fluid path weaving S (left & center) and M (double pulse crests) -->
  <path d="M 32 72 C 30 52, 48 46, 52 56 C 56 66, 64 74, 72 62 C 78 52, 88 54, 88 68" 
        fill="none" 
        stroke="url(#ribbonGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#coreGlow)"/>

  <!-- Bottom Flexible Electrode (Reflecting elastic counter-force) -->
  <path d="M 26 88 C 44 78, 76 78, 94 88" fill="none" stroke="url(#bottomPlateGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="26" cy="88" r="2.5" fill="#2dd4bf"/>
  <circle cx="94" cy="88" r="2.5" fill="#0d9488"/>

  <!-- Dielectric Electric Field Vectors (Subtle dashed links between plates) -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.5">
    <line x1="42" y1="38" x2="42" y2="82"/>
    <line x1="60" y1="40" x2="60" y2="80"/>
    <line x1="78" y1="38" x2="78" y2="82"/>
  </g>

  <!-- Nanocomposite Functional Nodes (TiO2, ZnO, Carbon / GO nanoclusters) -->
  <!-- Node 1: Left upper loop -->
  <circle cx="36" cy="54" r="3.2" fill="#38bdf8" filter="url(#softGlow)"/>
  <circle cx="36" cy="54" r="1.4" fill="#ffffff"/>

  <!-- Node 2: Center core nexus -->
  <circle cx="60" cy="60" r="4.5" fill="#ffffff" filter="url(#coreGlow)"/>
  <circle cx="60" cy="60" r="2.2" fill="#0284c7"/>

  <!-- Node 3: Right crest -->
  <circle cx="84" cy="58" r="3.2" fill="#2dd4bf" filter="url(#softGlow)"/>
  <circle cx="84" cy="58" r="1.4" fill="#ffffff"/>
</svg>
