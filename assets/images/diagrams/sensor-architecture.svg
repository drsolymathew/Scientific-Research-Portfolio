<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" aria-label="Schematic diagram of flexible capacitive pressure sensor architecture">
  <defs>
    <linearGradient id="pdmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect width="100%" height="100%" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>

  <!-- Technical Grid lines -->
  <g stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4,4">
    <line x1="60" y1="60" x2="740" y2="60"/>
    <line x1="60" y1="140" x2="740" y2="140"/>
    <line x1="60" y1="225" x2="740" y2="225"/>
    <line x1="60" y1="310" x2="740" y2="310"/>
    <line x1="60" y1="390" x2="740" y2="390"/>
    <line x1="200" y1="40" x2="200" y2="410"/>
    <line x1="400" y1="40" x2="400" y2="410"/>
    <line x1="600" y1="40" x2="600" y2="410"/>
  </g>

  <!-- Title & Specification -->
  <text x="70" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0f172a" letter-spacing="0.5">CAPACITIVE SENSOR ARCHITECTURE</text>
  <text x="70" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0284c7">C = ε₀ · εᵣ · (A / d)  |  Ternary Dielectric Nanocomposite</text>

  <!-- Applied Pressure Vectors (Top) -->
  <g transform="translate(400, 75)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <polygon points="-5,32 5,32 0,42" fill="#ef4444"/>
    <line x1="-120" y1="0" x2="-120" y2="35" stroke="#ef4444" stroke-width="2"/>
    <polygon points="-125,32 -115,32 -120,42" fill="#ef4444"/>
    <line x1="120" y1="0" x2="120" y2="35" stroke="#ef4444" stroke-width="2"/>
    <polygon points="115,32 125,32 120,42" fill="#ef4444"/>
    <text x="0" y="-8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#dc2626" text-anchor="middle">Applied Compressive Pressure (P)</text>
  </g>

  <!-- Layer 1: Top Flexible Substrate (PET / PI) -->
  <g filter="url(#subtleShadow)">
    <rect x="140" y="125" width="520" height="20" rx="3" fill="url(#subGrad)"/>
    <text x="670" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#475569">Flexible Substrate (PET, ~100 µm)</text>
    <line x1="655" y1="135" x2="665" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Layer 2: Top Electrode (Au / Cu / Conductive Mesh) -->
  <rect x="170" y="145" width="460" height="12" rx="2" fill="url(#goldGrad)"/>
  <text x="670" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#b45309">Top Electrode (Au/Cu thin film)</text>
  <line x1="625" y1="151" x2="665" y2="151" stroke="#d97706" stroke-width="1.5"/>

  <!-- Layer 3: Nanocomposite Dielectric (PDMS Matrix + Nanoparticles) -->
  <g filter="url(#subtleShadow)">
    <rect x="170" y="157" width="460" height="120" rx="4" fill="url(#pdmsGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Nanoparticles (TiO2 = Blue circles, ZnO = Teal Hexagons) inside dielectric -->
    <g fill="#0284c7" opacity="0.85">
      <circle cx="210" cy="180" r="6"/>
      <circle cx="260" cy="230" r="5"/>
      <circle cx="310" cy="190" r="7"/>
      <circle cx="370" cy="245" r="6"/>
      <circle cx="430" cy="185" r="5"/>
      <circle cx="490" cy="235" r="7"/>
      <circle cx="550" cy="195" r="6"/>
      <circle cx="590" cy="240" r="5"/>
      <circle cx="240" cy="210" r="5.5"/>
      <circle cx="340" cy="220" r="6"/>
      <circle cx="460" cy="210" r="7"/>
      <circle cx="520" cy="175" r="5"/>
    </g>

    <g fill="#0d9488" opacity="0.85">
      <!-- ZnO particles -->
      <polygon points="230,175 236,178 236,186 230,189 224,186 224,178"/>
      <polygon points="280,240 287,244 287,252 280,256 273,252 273,244"/>
      <polygon points="390,195 397,199 397,207 390,211 383,207 383,199"/>
      <polygon points="470,245 476,248 476,256 470,259 464,256 464,248"/>
      <polygon points="570,210 577,214 577,222 570,226 563,222 563,214"/>
      <polygon points="330,170 336,173 336,181 330,184 324,181 324,173"/>
    </g>

    <!-- Dimension arrows (d: thickness) -->
    <line x1="150" y1="157" x2="150" y2="277" stroke="#0284c7" stroke-width="1.5"/>
    <polygon points="146,164 154,164 150,157" fill="#0284c7"/>
    <polygon points="146,270 154,270 150,277" fill="#0284c7"/>
    <text x="135" y="222" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#0284c7" text-anchor="end">d (dielectric thickness)</text>

    <!-- Dielectric Label -->
    <text x="670" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#0369a1">PDMS Dielectric Layer</text>
    <text x="670" y="228" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">+ TiO₂ &amp; ZnO nanofillers</text>
    <line x1="628" y1="215" x2="665" y2="215" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Layer 4: Bottom Electrode -->
  <rect x="170" y="277" width="460" height="12" rx="2" fill="url(#goldGrad)"/>
  <text x="670" y="285" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#b45309">Bottom Electrode (Au/Cu)</text>
  <line x1="625" y1="281" x2="665" y2="281" stroke="#d97706" stroke-width="1.5"/>

  <!-- Layer 5: Bottom Flexible Substrate -->
  <g filter="url(#subtleShadow)">
    <rect x="140" y="289" width="520" height="20" rx="3" fill="url(#subGrad)"/>
    <text x="670" y="303" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#475569">Bottom Substrate (PET)</text>
    <line x1="655" y1="299" x2="665" y2="299" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Electrical Readout Terminal Leads -->
  <g stroke="#0284c7" stroke-width="2" fill="none">
    <path d="M 170,151 L 100,151 L 100,200"/>
    <path d="M 170,283 L 100,283 L 100,230"/>
    <circle cx="100" cy="200" r="4" fill="#0284c7"/>
    <circle cx="100" cy="230" r="4" fill="#0284c7"/>
  </g>
  <!-- LCR Meter icon box -->
  <rect x="65" y="195" width="70" height="40" rx="4" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
  <text x="100" y="212" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">LCR METER</text>
  <text x="100" y="226" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0284c7" text-anchor="middle">ΔC / C₀ readout</text>

  <!-- Legend in Footer -->
  <g transform="translate(140, 360)">
    <rect x="0" y="0" width="520" height="45" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Item 1 -->
    <circle cx="30" cy="22" r="5" fill="#0284c7"/>
    <text x="45" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#334155">TiO₂ Nanoparticles (High-k)</text>
    <!-- Item 2 -->
    <polygon points="210,18 215,20 215,26 210,29 205,26 205,20" fill="#0d9488"/>
    <text x="225" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#334155">ZnO Nanostructures</text>
    <!-- Item 3 -->
    <rect x="365" y="18" width="16" height="8" rx="2" fill="#d97706"/>
    <text x="390" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#334155">Conductive Electrodes</text>
  </g>
</svg>
