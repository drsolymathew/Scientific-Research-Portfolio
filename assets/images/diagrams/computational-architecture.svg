<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%" aria-label="AI-Assisted Scientific Computing and Reproducible Research Workflow">
  <defs>
    <filter id="softShadowComp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1a2f"/>
      <stop offset="100%" stop-color="#08101e"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect width="100%" height="100%" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>

  <!-- Diagram Title & Subtitle -->
  <text x="40" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.5">SCIENTIFIC COMPUTING &amp; AI-ASSISTED RESEARCH WORKFLOW</text>
  <text x="40" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0284c7">Experimental Sensor Testing &#8226; Python Automation &#8226; AI Assistance (Claude/Copilot/Antigravity) &#8226; Verified Results</text>

  <!-- STAGE 1: Experimental Laboratory Physics -->
  <g transform="translate(40, 85)" filter="url(#softShadowComp)">
    <rect width="185" height="195" rx="8" fill="url(#stepGrad1)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="185" height="4" rx="2" fill="#64748b"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#475569">STAGE 01</text>
    <text x="14" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Lab Experiments</text>
    <line x1="14" y1="52" x2="171" y2="52" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="14" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#334155">&#8226; Nanocomposite synthesis</text>
    <text x="14" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#334155">&#8226; Spin coating &amp; casting</text>
    <text x="14" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#334155">&#8226; LCR meter data logging</text>
    <text x="14" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#334155">&#8226; Compression fatigue</text>
    
    <rect x="14" y="152" width="157" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="22" y="170" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0f172a">OUTPUT: Raw CSV Data</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="225" y1="182" x2="255" y2="182" stroke="#0284c7" stroke-width="2"/>
  <polygon points="255,182 247,178 247,186" fill="#0284c7"/>

  <!-- STAGE 2: Python & Scientific Computing -->
  <g transform="translate(260, 85)" filter="url(#softShadowComp)">
    <rect width="185" height="195" rx="8" fill="url(#stepGrad2)" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="0" y="0" width="185" height="4" rx="2" fill="#0284c7"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#0284c7">STAGE 02</text>
    <text x="14" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Scientific Python</text>
    <line x1="14" y1="52" x2="171" y2="52" stroke="#bfdbfe" stroke-width="1"/>
    
    <text x="14" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#1e3a8a">&#8226; NumPy &amp; Pandas ETL</text>
    <text x="14" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#1e3a8a">&#8226; Polynomial drift filter</text>
    <text x="14" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#1e3a8a">&#8226; Sensitivity slope S</text>
    <text x="14" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#1e3a8a">&#8226; Hysteresis &amp; kinetics</text>

    <rect x="14" y="152" width="157" height="28" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="22" y="170" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0369a1">JupyterLab Pipelines</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="445" y1="182" x2="475" y2="182" stroke="#0284c7" stroke-width="2"/>
  <polygon points="475,182 467,178 467,186" fill="#0284c7"/>

  <!-- STAGE 3: AI-Assisted Programming -->
  <g transform="translate(480, 85)" filter="url(#softShadowComp)">
    <rect width="195" height="195" rx="8" fill="url(#stepGrad3)" stroke="#86efac" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="4" rx="2" fill="#16a34a"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#15803d">STAGE 03</text>
    <text x="14" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">AI-Assisted Coding</text>
    <line x1="14" y1="52" x2="181" y2="52" stroke="#bbf7d0" stroke-width="1"/>
    
    <text x="14" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#14532d">&#8226; Claude Code / Copilot</text>
    <text x="14" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#14532d">&#8226; Google Antigravity</text>
    <text x="14" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#14532d">&#8226; SKILL.md instruction rules</text>
    <text x="14" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#14532d">&#8226; Unit testing with pytest</text>

    <rect x="14" y="152" width="167" height="28" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
    <text x="20" y="170" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#15803d">PRODUCTIVITY &amp; TESTS</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="675" y1="182" x2="705" y2="182" stroke="#16a34a" stroke-width="2"/>
  <polygon points="705,182 697,178 697,186" fill="#16a34a"/>

  <!-- STAGE 4: Reproducible Science & Verification -->
  <g transform="translate(710, 85)" filter="url(#softShadowComp)">
    <rect width="170" height="195" rx="8" fill="url(#stepGrad4)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="4" rx="2" fill="#38bdf8"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38bdf8">STAGE 04</text>
    <text x="14" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Verified Outputs</text>
    <line x1="14" y1="52" x2="156" y2="52" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    
    <text x="14" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">&#8226; Human code inspection</text>
    <text x="14" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">&#8226; Publication figures</text>
    <text x="14" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">&#8226; Reproducible records</text>
    <text x="14" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">&#8226; Git version control</text>

    <rect x="14" y="152" width="142" height="28" rx="4" fill="rgba(255,255,255,0.08)" stroke="#38bdf8" stroke-width="1"/>
    <text x="20" y="170" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">100% VERIFIED SCIENCE</text>
  </g>

  <!-- Bottom Clarification Banner -->
  <rect x="40" y="305" width="840" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="326" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#0f172a">
    Core Principle: AI tools serve as assistants to enhance coding productivity, reproducibility, and analytical rigor.
  </text>
  <text x="56" y="342" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">
    All experimental hypotheses, physical interpretations, and publication figures remain strictly directed and verified by the materials scientist.
  </text>
</svg>
