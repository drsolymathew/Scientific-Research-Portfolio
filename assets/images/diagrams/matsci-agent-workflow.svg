<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%" aria-label="Research-Specific AI Workflow and Domain Instructions Architecture">
  <defs>
    <filter id="softShadowSkill" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="skillGradNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1a2f"/>
      <stop offset="100%" stop-color="#08101e"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect width="100%" height="100%" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>

  <!-- Header -->
  <text x="40" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.5">RESEARCH-SPECIFIC AI INSTRUCTIONS &amp; TOOL INTEGRATIONS</text>
  <text x="40" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0d9488">Reusable Instructions (SKILL.md / CLAUDE.md) &#8226; AI Coding Assistants &#8226; Existing MCP Tools &#8226; Mandatory Human Verification</text>

  <!-- Node 1: Domain Instructions & Rules -->
  <g transform="translate(40, 85)" filter="url(#softShadowSkill)">
    <rect width="200" height="195" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="4" rx="2" fill="#0284c7"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#0284c7">CONFIG &amp; RULES</text>
    <text x="14" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">1. Research Instructions</text>
    <line x1="14" y1="52" x2="186" y2="52" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="14" y="74" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#334155">&#8226; CLAUDE.md</text>
    <text x="14" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#334155">&#8226; Copilot instructions</text>
    <text x="14" y="110" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#0369a1">&#8226; SKILL.md workflows:</text>
    <text x="24" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">- sensor-data-analysis</text>
    <text x="24" y="144" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">- literature-review</text>
    <text x="24" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">- report-writing</text>

    <text x="14" y="180" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#059669">Reusable Lab Guidelines</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="240" y1="182" x2="275" y2="182" stroke="#0284c7" stroke-width="2"/>
  <polygon points="275,182 267,178 267,186" fill="#0284c7"/>

  <!-- Node 2: AI Coding Assistant -->
  <g transform="translate(280, 85)" filter="url(#softShadowSkill)">
    <rect width="195" height="195" rx="8" fill="url(#skillGradNavy)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="4" rx="2" fill="#38bdf8"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38bdf8">CODING ASSISTANTS</text>
    <text x="14" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">2. Modern AI Tools</text>
    <line x1="14" y1="52" x2="181" y2="52" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    
    <text x="14" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">&#8226; Claude Code CLI</text>
    <text x="14" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">&#8226; GitHub Copilot</text>
    <text x="14" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">&#8226; Google Antigravity</text>
    <text x="14" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#cbd5e1">&#8226; Code review &amp; refactor</text>

    <rect x="14" y="152" width="167" height="28" rx="4" fill="rgba(255,255,255,0.08)" stroke="#38bdf8" stroke-width="1"/>
    <text x="20" y="170" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">PYTHON CODE ASSIST</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="475" y1="182" x2="510" y2="182" stroke="#0284c7" stroke-width="2"/>
  <polygon points="510,182 502,178 502,186" fill="#0284c7"/>

  <!-- Node 3: Existing Tools & MCP Integrations -->
  <g transform="translate(515, 85)" filter="url(#softShadowSkill)">
    <rect width="185" height="195" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="0" y="0" width="185" height="4" rx="2" fill="#0d9488"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#0f766e">INTEGRATIONS</text>
    <text x="14" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">3. Existing Tools</text>
    <line x1="14" y1="52" x2="171" y2="52" stroke="#99f6e4" stroke-width="1"/>
    
    <text x="14" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#134e4a">&#8226; Local filesystem MCP</text>
    <text x="14" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#134e4a">&#8226; Git repository tools</text>
    <text x="14" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#134e4a">&#8226; DOI literature lookup</text>
    <text x="14" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#134e4a">&#8226; Data privacy protection</text>

    <rect x="14" y="152" width="157" height="28" rx="4" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/>
    <text x="20" y="170" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#0f766e">STANDARD TOOLS</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="700" y1="182" x2="735" y2="182" stroke="#0d9488" stroke-width="2"/>
  <polygon points="735,182 727,178 727,186" fill="#0d9488"/>

  <!-- Node 4: Mandatory Human Verification -->
  <g transform="translate(740, 85)" filter="url(#softShadowSkill)">
    <rect width="140" height="195" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="4" rx="2" fill="#d97706"/>
    <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#b45309">SCIENTIST</text>
    <text x="12" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#92400e">4. Verification</text>
    <line x1="12" y1="52" x2="128" y2="52" stroke="#fde68a" stroke-width="1"/>
    
    <text x="12" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78350f">&#8226; Check math &amp; plots</text>
    <text x="12" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78350f">&#8226; Verify DOI sources</text>
    <text x="12" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78350f">&#8226; Validate physics</text>
    <text x="12" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78350f">&#8226; Review test suites</text>

    <rect x="10" y="152" width="120" height="28" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="14" y="170" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#b45309">HUMAN CONTROL</text>
  </g>

  <!-- Bottom Explanatory Notice -->
  <rect x="40" y="305" width="840" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="326" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#0f172a">
    Architectural Clarification: Custom SKILL.md and CLAUDE.md files provide reusable instructions for existing AI assistants, not standalone autonomous agents.
  </text>
  <text x="56" y="342" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">
    All scientific code, numerical results, and literature citations undergo rigorous human peer-review and experimental validation.
  </text>
</svg>
