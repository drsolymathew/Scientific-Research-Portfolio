<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" aria-label="Real-time arterial pulse wave monitoring and tactile sensing response time dynamics">
  <defs>
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect width="100%" height="100%" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>

  <!-- Title -->
  <text x="70" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0f172a" letter-spacing="0.5">PHYSIOLOGICAL PULSE WAVE &amp; TACTILE TRANSDUCTION</text>
  <text x="70" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0284c7">Non-Invasive Radial Artery Waveform (P₁, P₂, P₃) &amp; Sub-50ms Response Kinetics</text>

  <!-- Left: Pulse Wave Signal (Width 400, Height 260) -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="410" height="290" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Pulse Wave Chart Axes & Grid -->
    <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3">
      <line x1="45" y1="50" x2="385" y2="50"/>
      <line x1="45" y1="110" x2="385" y2="110"/>
      <line x1="45" y1="170" x2="385" y2="170"/>
      <line x1="45" y1="230" x2="385" y2="230"/>
    </g>
    <line x1="45" y1="230" x2="390" y2="230" stroke="#475569" stroke-width="1.5"/>
    <line x1="45" y1="40" x2="45" y2="230" stroke="#475569" stroke-width="1.5"/>

    <!-- Axis Labels -->
    <text x="215" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Time (s)</text>
    <text x="45" y="245" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">0.0</text>
    <text x="130" y="245" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">0.8</text>
    <text x="215" y="245" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">1.6</text>
    <text x="300" y="245" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">2.4</text>
    <text x="385" y="245" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">3.2</text>
    
    <text x="25" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle" transform="rotate(-90 25 135)">Capacitance (pF)</text>

    <!-- Pulse Wave 1: 0 to 130 -->
    <!-- Shape: Base at y=210 -> P1 peak at (90, 70) -> P2 peak at (110, 115) -> notch at (120, 140) -> P3 dicrotic at (135, 125) -> return to base at (175, 210) -->
    <path d="M 45,210 Q 70,210 80,150 L 95,70 Q 102,85 110,115 Q 118,135 125,140 Q 132,130 140,125 Q 155,160 175,210" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <!-- Cycle 2 -->
    <path d="M 175,210 Q 200,210 210,150 L 225,70 Q 232,85 240,115 Q 248,135 255,140 Q 262,130 270,125 Q 285,160 305,210" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <!-- Cycle 3 -->
    <path d="M 305,210 Q 330,210 340,150 L 355,70 Q 362,85 370,115 Q 375,130 385,138" fill="none" stroke="#0284c7" stroke-width="2.5"/>

    <!-- Peak Identifiers (P1, P2, P3 on Cycle 2) -->
    <!-- P1: Percussion Wave -->
    <circle cx="225" cy="70" r="4" fill="#ef4444"/>
    <text x="225" y="58" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle">P₁</text>
    <text x="225" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Percussion wave</text>

    <!-- P2: Tidal Wave -->
    <circle cx="240" cy="115" r="3.5" fill="#f59e0b"/>
    <text x="252" y="112" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#d97706">P₂</text>

    <!-- P3: Dicrotic Wave -->
    <circle cx="270" cy="125" r="3.5" fill="#10b981"/>
    <text x="282" y="123" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#059669">P₃</text>

    <text x="20" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Continuous Wrist Pulse Waveform</text>
  </g>

  <!-- Right: Response & Recovery Time Kinetics (Width 250, Height 290) -->
  <g transform="translate(490, 95)">
    <rect x="0" y="0" width="250" height="290" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Step Response Time</text>

    <!-- Step response curve -->
    <g transform="translate(25, 45)">
      <!-- Axes -->
      <line x1="20" y1="160" x2="190" y2="160" stroke="#64748b" stroke-width="1.5"/>
      <line x1="20" y1="20" x2="20" y2="160" stroke="#64748b" stroke-width="1.5"/>
      
      <!-- Step rise: from (30,150) -> sharp rise to (55, 40) -> plateau to (110, 40) -> fall to (135, 150) -->
      <path d="M 20,150 L 40,150 Q 50,150 55,50 Q 60,40 70,40 L 115,40 Q 125,40 130,140 Q 133,150 145,150 L 180,150" fill="none" stroke="#0d9488" stroke-width="2.5"/>

      <!-- Response time delta (tau_r) -->
      <line x1="40" y1="70" x2="65" y2="70" stroke="#0284c7" stroke-width="1.5"/>
      <polygon points="40,68 40,72 36,70" fill="#0284c7"/>
      <polygon points="65,68 65,72 69,70" fill="#0284c7"/>
      <text x="52" y="64" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0284c7" text-anchor="middle">τᵣ &lt; 38 ms</text>

      <!-- Recovery time delta (tau_d) -->
      <line x1="115" y1="70" x2="140" y2="70" stroke="#059669" stroke-width="1.5"/>
      <polygon points="115,68 115,72 111,70" fill="#059669"/>
      <polygon points="140,68 140,72 144,70" fill="#059669"/>
      <text x="127" y="64" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">τ_d &lt; 45 ms</text>
    </g>

    <!-- Key Metrics Card -->
    <g transform="translate(15, 205)">
      <rect x="0" y="0" width="220" height="70" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#334155">Fast Viscoelastic Recovery:</text>
      <text x="10" y="34" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0284c7">• Response: ~38 ms (Instantaneous)</text>
      <text x="10" y="50" font-family="'JetBrains Mono', monospace" font-size="10" fill="#059669">• Relaxation: ~45 ms (No drift)</text>
      <text x="10" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">Verified over 2,000+ compression cycles</text>
    </g>
  </g>
</svg>
