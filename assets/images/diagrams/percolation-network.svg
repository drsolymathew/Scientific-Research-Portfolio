<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" aria-label="Microscopic percolation network and interfacial polarization in ternary polymer nanocomposites">
  <defs>
    <radialGradient id="polymerMatrix" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect width="100%" height="100%" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>

  <!-- Title -->
  <text x="70" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0f172a" letter-spacing="0.5">TERNARY NANOCOMPOSITE MICROSTRUCTURE &amp; PERCOLATION</text>
  <text x="70" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0d9488">Interfacial Maxwell-Wagner-Sillars (MWS) Polarization &amp; Micro-Capacitor Networks</text>

  <!-- Main Microstructure Viewport -->
  <rect x="70" y="90" width="460" height="310" rx="8" fill="url(#polymerMatrix)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Polymer chains (PDMS silicone coils) -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 85,140 Q 130,110 180,150 T 260,130 T 340,160 T 420,130 T 500,160"/>
    <path d="M 85,210 Q 140,240 210,190 T 300,230 T 380,190 T 480,240"/>
    <path d="M 90,290 Q 160,260 230,310 T 330,280 T 420,320 T 510,290"/>
    <path d="M 120,360 Q 200,340 280,380 T 390,350 T 470,370"/>
  </g>

  <!-- Micro-capacitor coupling lines (Interfacial Polarization) -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8">
    <line x1="160" y1="180" x2="210" y2="230"/>
    <line x1="210" y1="230" x2="280" y2="190"/>
    <line x1="280" y1="190" x2="340" y2="240"/>
    <line x1="340" y1="240" x2="400" y2="180"/>
    <line x1="400" y1="180" x2="450" y2="230"/>
    <line x1="210" y1="230" x2="260" y2="300"/>
    <line x1="260" y1="300" x2="340" y2="320"/>
    <line x1="340" y1="320" x2="410" y2="290"/>
  </g>

  <!-- Graphene Oxide / Carbon Black conductive flakes (Dark Slate 2D flakes) -->
  <g fill="#334155" opacity="0.9">
    <polygon points="140,170 175,175 165,195 130,185"/>
    <polygon points="260,180 295,188 285,208 250,198"/>
    <polygon points="380,170 415,178 405,198 370,188"/>
    <polygon points="245,290 278,295 270,315 235,308"/>
    <polygon points="390,280 425,285 418,305 380,298"/>
  </g>

  <!-- TiO2 High-k Nanoparticles (Blue Spheres with gradient/glow) -->
  <g fill="#0284c7" filter="url(#glowEffect)">
    <circle cx="210" cy="230" r="16"/>
    <circle cx="340" cy="240" r="18"/>
    <circle cx="450" cy="230" r="15"/>
    <circle cx="170" cy="300" r="14"/>
    <circle cx="300" cy="340" r="15"/>
    <circle cx="430" cy="340" r="16"/>
    <circle cx="120" cy="230" r="12"/>
    <circle cx="470" cy="150" r="14"/>
  </g>
  <!-- Highlight on TiO2 -->
  <g fill="#e0f2fe" opacity="0.7">
    <circle cx="206" cy="226" r="4"/>
    <circle cx="335" cy="235" r="5"/>
    <circle cx="446" cy="226" r="4"/>
  </g>

  <!-- ZnO Semiconductor Nanorods / Tetrapods (Teal) -->
  <g stroke="#0d9488" stroke-width="4" stroke-linecap="round">
    <!-- Nanorod 1 -->
    <line x1="180" y1="130" x2="220" y2="155"/>
    <!-- Nanorod 2 -->
    <line x1="290" y1="240" x2="310" y2="280"/>
    <!-- Nanorod 3 -->
    <line x1="330" y1="130" x2="365" y2="155"/>
    <!-- Nanorod 4 -->
    <line x1="360" y1="290" x2="395" y2="330"/>
    <!-- Nanorod 5 -->
    <line x1="230" y1="340" x2="265" y2="365"/>
  </g>

  <!-- Micro-Capacitor Callout (Zoom indicator) -->
  <g transform="translate(560, 95)">
    <rect x="0" y="0" width="200" height="145" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Micro-Capacitor Model</text>
    <text x="15" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0284c7">C_eff = Σ (ε₀ ε_local A_i / d_i)</text>
    <line x1="15" y1="52" x2="185" y2="52" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#475569">Filler particles act as internal</text>
    <text x="15" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#475569">capacitive electrodes, sharply</text>
    <text x="15" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#475569">increasing dielectric constant (k)</text>
    <text x="15" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#475569">without loss of elasticity.</text>
  </g>

  <!-- Key Material Legend on right bottom -->
  <g transform="translate(560, 255)">
    <rect x="0" y="0" width="200" height="145" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Composite Phases</text>
    
    <!-- Item 1: PDMS Matrix -->
    <rect x="15" y="38" width="16" height="10" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="40" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#334155">PDMS Elastomer Matrix</text>

    <!-- Item 2: TiO2 -->
    <circle cx="23" cy="65" r="7" fill="#0284c7"/>
    <text x="40" y="69" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#334155">TiO₂ High-k Nano-spheres</text>

    <!-- Item 3: ZnO -->
    <line x1="15" y1="88" x2="31" y2="88" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/>
    <text x="40" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#334155">ZnO Semiconductor Rods</text>

    <!-- Item 4: Conductive Phase -->
    <polygon points="16,110 28,106 31,116 19,118" fill="#334155"/>
    <text x="40" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#334155">GO / CB Conductive Filler</text>

    <!-- Item 5: Polarization Coupling -->
    <line x1="15" y1="133" x2="31" y2="133" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="40" y="137" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#334155">Interfacial Polarization</text>
  </g>
</svg>
